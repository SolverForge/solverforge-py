[package]
name = "solverforge_py"
version = "0.7.2"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.95"
description = "PyO3 dynamic Python bindings for the SolverForge constraint solver"
readme = "README.md"
repository = "https://github.com/SolverForge/solverforge-py"
homepage = "https://solverforge.org"
documentation = "https://docs.solverforge.org"
include = [
    "/Cargo.lock",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
    "/python/solverforge/*.py",
    "/python/solverforge/*.pyi",
    "/python/solverforge/py.typed",
    "/rust-toolchain.toml",
    "/src/**",
]

[lib]
name = "solverforge_py"
crate-type = ["cdylib", "rlib"]

[package.metadata.solverforge]
version = "0.31.2"

[dependencies]
parking_lot = "0.12.5"
pyo3 = "0.27.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

solverforge-config = { version = "=0.31.2" }
solverforge-bridge = { version = "=0.31.2" }
solverforge-console = { version = "=0.31.2", features = ["verbose-logging"] }
solverforge-core = { version = "=0.31.2" }
solverforge-scoring = { version = "=0.31.2" }
solverforge-solver = { version = "=0.31.2" }
solverforge-ui = { version = "=0.9.0", default-features = false }

[features]
extension-module = ["pyo3/extension-module"]

[profile.dev]
opt-level = 3
